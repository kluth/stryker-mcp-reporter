name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Quality Gates
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # Wir schalten den Cache hier temporär ab, da der alte Cache
          # auf den GitHub-Servern korrupt ist und NPM zum Absturz bringt.
          # cache: 'npm'

      - name: Update NPM (Bypass NPM Bug)
        # Zwingt den Runner, den internen NPM-Bugfall durch die neueste Version zu patchen
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: Run Mutation Testing (Stryker)
        run: npm run test:mutation
