name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Quality Gates
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies (Tabula Rasa)
        # 1. Löscht die potenziell kaputte Lock-Datei aus dem Checkout
        # 2. Leert den internen NPM-Cache rigoros
        # 3. Führt einen sauberen Install direkt aus der package.json aus
        run: |
          rm -f package-lock.json
          npm cache clean --force
          npm install --no-audit --no-fund
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Compile TypeScript
        run: npm run build

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: Run Mutation Testing (Stryker)
        run: npm run test:mutation
