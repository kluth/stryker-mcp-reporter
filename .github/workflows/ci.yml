name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Quality Gates
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: Run Mutation Testing (Stryker)
        # Führt Stryker aus und bricht den Build ab, wenn der Score unter die
        # in der stryker.config.mjs definierte Schwelle (idealerweise 100) fällt.
        run: npm run test:mutation
