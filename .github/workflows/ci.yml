name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Quality Gates
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm ci
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Build Bundle (tsup)
        run: npm run build

      - name: Verify Bundle Size & Structure
        run: npm pack --dry-run

      - name: Run Unit Tests (Vitest)
        run: npm run test

      - name: Run E2E Tests
        run: npm run test:e2e

      - name: Run Incremental Mutation Testing (Stryker)
        run: npx stryker run --incremental
        env:
          STRYKER_DASHBOARD_API_KEY: "" # local only

  release:
    name: Semantic Release
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Erforderlich für die Commit-Analyse von Semantic Release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Dependencies
        run: npm install --no-audit --no-fund
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Build Project
        run: npm run build

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: npx semantic-release

  announce-release:
    name: Generate & Post Release Announcements
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      discussions: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Generate & Publish Multi-Platform Release Announcements
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/generate_release_announcements.js


      - name: Upload Announcement Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-announcements
          path: dist/announcements/


